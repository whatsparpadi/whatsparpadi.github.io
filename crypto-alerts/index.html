    <!-- Custom Styling for Twitter-style Crypto Feed -->
    <style>
        .crypto-feed-container {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 50px;
        }

        .crypto-feed-post {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .crypto-feed-post:hover {
            box-shadow: var(--shadow-hover);
        }

        .feed-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .author-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
            flex-shrink: 0;
        }

        .header-meta {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .coin-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .coin-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--heading-color);
            margin: 0;
            line-height: 1.2;
        }

        .exchange-badge {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        body.dark-mode .exchange-badge {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
        }

        .trade-type-badge {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        body.dark-mode .trade-type-badge {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }

        .post-subtext {
            font-size: 0.85rem;
            opacity: 0.75;
            color: var(--text-color);
            margin-top: 4px;
        }

        .pulse-status {
            color: #10b981;
            font-weight: 700;
        }

        /* Chart container placed immediately after coin name */
        .feed-chart-wrapper {
            width: 100%;
            margin-top: 16px;
            margin-bottom: 20px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
        }

        .feed-chart-container {
            width: 100%;
            height: 550px;
        }

        @media (max-width: 768px) {
            .feed-chart-container {
                height: 420px;
            }
        }

        .feed-description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-color);
        }

        .feed-description p {
            margin-bottom: 12px;
        }

        .feed-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .feed-tag {
            font-size: 0.85rem;
            font-weight: 600;
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.08);
            padding: 4px 10px;
            border-radius: 14px;
        }

        body.dark-mode .feed-tag {
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.15);
        }

        .read-full-post-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--heading-color);
            color: var(--bg-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        body.dark-mode .read-full-post-btn {
            background: #38bdf8;
            color: #0f172a;
        }

        .read-full-post-btn:hover {
            opacity: 0.9;
            transform: translateX(3px);
        }

        .crypto-hub-banner {
            max-width: 850px;
            margin: 0 auto 30px auto;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95)), url('../assets/images/crypto_bluai.png');
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            padding: 30px;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .crypto-hub-banner h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .crypto-hub-banner p {
            font-size: 1rem;
            opacity: 0.9;
            color: #cbd5e1;
            margin-bottom: 0;
        }

        /* Responsive Breakpoints for Feed */
        @media (max-width: 600px) {
            .crypto-feed-post {
                padding: 16px;
                border-radius: 16px;
            }
            .crypto-hub-banner {
                padding: 20px 16px;
                border-radius: 16px;
            }
            .crypto-hub-banner h2 {
                font-size: 1.4rem;
            }
            .coin-name {
                font-size: 1.15rem;
            }
            .feed-actions-row {
                flex-direction: column;
                align-items: stretch !important;
            }
            .feed-actions-row > div:last-child {
                width: 100%;
                justify-content: stretch;
            }
            .feed-actions-row button,
            .feed-actions-row a.read-full-post-btn {
                flex: 1;
                justify-content: center;
                text-align: center;
            }
        }
    </style>
